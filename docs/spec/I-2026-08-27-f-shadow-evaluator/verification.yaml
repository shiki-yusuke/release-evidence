success_criteria_matrix:
  - criterion: release-evidence-shadow replay が実 release corpus
      に対して決定論的に走る（同一入力を別プロセスで2回実行し出力 byte 一致）
    covered_by: manual
    evidence: 実 corpus 5 release の replay pack で別プロセス2回実行、cmp 差分ゼロ 5/5
      (real-corpus-replay-20260827.md)。加えて test/shadow-cli.test.ts の2プロセス比較が
      TZ/locale/順序 permutation でも byte 一致を回帰担保
    negation_test: 1 byte でも差があれば cmp が非0。permutation テストは入力順序反転で差が出れば fail
  - criterion: pre_promotion 述語6種すべてが実装され、解決できない場合は明示的 unknown + closed reason code
      になる（黙って satisfied にしない）
    covered_by: test
    evidence: 述語6種の satisfied/contradicted/unknown+reason 3方向テスト
      (test/shadow-evaluate.test.ts)。terra が7巡で試みた false satisfied 攻撃（契約不正
      record / kind 解決 / cut 迂回 / 孤立 event chain / release_id 偽装 / event_id
      重複）は全て回帰テスト化 され reject される
    negation_test: terra の各再現攻撃がそのままテストになっており、防御が外れればテストが fail
  - criterion: shadow 出力自身が evidence-closed（input_manifest digest と record_digest を
      pipeline 外の独立再計算で検証できる）
    covered_by: manual
    evidence: "MV-R2: Python 別実装で record_digest を独立再計算し実 corpus 出力 5/5 一致。
      test/shadow-tamper.test.ts は record_digest 差し替えの検出を回帰担保"
    negation_test: 出力 body の1フィールド改変で再計算 digest が宣言値と不一致になる (tamper テストが検証済み)
  - criterion: live 化の構造的防止が機械検証される（mode=shadow_only / verdict による非0 exit なし /
      cohort-2-live-lock.json 有効時に deploy・gate 系から shadow module への import
      が1件でもあればテストが fail）
    covered_by: test
    evidence: "test/shadow-architecture.test.ts 36 テスト: production src default-deny
      + node:module supply-cut + getBuiltinModule/eval/data: URL 遮断 +
      違反注入の自己テスト。 CLI は verdict によらず exit 0 (test/shadow-cli.test.ts)。脅威モデル境界は
      round G で明文化"
    negation_test: 違反 import を合成した一時ファイルで guard が fail する自己テストが各経路にある
  - criterion: conformance parity（vendored 契約 fixtures）+ 改ざん注入 + 決定論の3系統のテストが全部 green
    covered_by: test
    evidence: 契約 dir 指定で 369/369 passed・0 skipped (terra round 7 実測)。未指定でも 284
      passed / 45 skipped (skip は既存規約どおり)。改ざん注入は semantic_digest 再計算込み、 parity は
      fixture 全列挙で件数 hardcode なし
    negation_test: fixture 期待の accept/reject を1件反転すれば parity が fail。正常系58件の 過剰
      reject 0 も terra が独立確認
cross_check_intent_vs_spec:
  performed_at: 2026-08-27 (Phase 4)
  finding: 齟齬なし。intent.success 5件は spec の採用済み設計・テスト節と1:1対応。spec の非目標 （live gate /
    approval consumer / selection_manifest 契約化 / receipt 契約変更）が diff に
    含まれないことを確認（src/core・src/cli・vendor/playbook-shared・.github は無変更）。 spec
    からの逸脱1件（policy ref の digest|null 二択）は deviation として記録し人間確認に付す。 architecture
    guard の脅威モデル境界（事故防止、悪意ある同一 repo 著者は対象外）は round G で明文化し、frozen decision
    の「静的走査は必要条件」と整合
