schema_version: "1.0"
intent_id: I-2026-08-27-f-shadow-evaluator
test_matrix:
  - ears_rule: 契約検証層 (record/collection semantic MUST、terra must 1/7/D-1/E-1)
    test_type: unit
    test_file: test/shadow-evaluate.test.ts
    test_name: 契約不正 record → record_invalid / release_id 整合 / event_id occurrence 単位
      uniqueness
    status: added
  - ears_rule: "pointer chain (must 2/C-2: review-finding / rollback / selection /
      policy digest 解決)"
    test_type: unit
    test_file: test/shadow-evaluate.test.ts
    test_name: pointer 無し→unknown、解決→satisfied、policy digest|null 二択
    status: added
  - ears_rule: "evaluation_cut (must 3: observed_at 必須・実在日時・cut 後除外)"
    test_type: unit
    test_file: test/shadow-evaluate.test.ts
    test_name: must-3 regression 4本 (不正cut/観測省略/時刻不一致/未来record改ざん)
    status: added
  - ears_rule: "決定論 (must 4/C-3: 重複 digest 拒否・input_errors 決定的ソート)"
    test_type: integration
    test_file: test/shadow-cli.test.ts
    test_name: 2プロセス byte 比較 + records/errors permutation
    status: added
  - ears_rule: "receipt full-fidelity (must 5: semantic MUST 実行・projection 照合)"
    test_type: integration
    test_file: test/shadow-tamper.test.ts
    test_name: semantic_digest 再計算込み改ざんを reference verifier が reject
    status: added
  - ears_rule: "architecture lock (must 6/C-4/E-2/F/G: default-deny + supply-cut + 3経路遮断)"
    test_type: unit
    test_file: test/shadow-architecture.test.ts
    test_name: "36 テスト (AST default-deny / node:module supply-cut / getBuiltinModule
      / eval / data: URL)"
    status: added
  - ears_rule: conformance parity (vendored 3契約 + release-evidence fixtures 全列挙)
    test_type: regression
    test_file: test/shadow-conformance.test.ts
    test_name: accept/reject 期待完全一致 (契約 dir 指定時 369/369、正常系58件の過剰 reject 0)
    status: added
  - ears_rule: replay pack e2e (契約 valid record で構成、collection 検証済み expected)
    test_type: integration
    test_file: test/shadow-replay-pack.test.ts
    test_name: lane-backed / lane-ref-omitted の CLI e2e
    status: added
test_gaps:
  - taxonomy: lifecycle_missed
    description: CI は RELEASE_EVIDENCE_CONTRACTS_DIR 未設定のため45件が
      skip（release-approval conformance 含む）。CI で外部契約を用意し zero-skip
      にするのは別タスク（terra round 7 should）
    priority: medium
  - taxonomy: compatibility_missed
    description: 実 corpus 5件は全て selection manifest 不在の非 lane release で、6述語の実データ
      評価には未到達。live unlock 前に lane-backed 実 corpus の replay が必要（terra round 7
      should、 real-corpus-replay-20260827.md に記録）
    priority: high
  - taxonomy: knowledge_missed
    description: privilege_boundary は契約に CI 設定の record kind が無く常に unknown_structural
      （verdict ready_for_approval は現契約では出ない）。receipt が preview event / rollback
      history を束縛できない点と合わせ G 前の contract gap として playbook へ（chunk 2 記録）
    priority: high
manual_verification:
  - id: MV-R1
    description: 実 release corpus 5件 (agent-metrics-dashboard、harvester metrics-data
      由来) の replay。bundle digest 宣言値と再計算値 5/5 一致、全件 unknown_structural で正直に停止、
      false allow ゼロ、別プロセス2回実行の byte 比較 5/5 IDENTICAL
    expected_status: 実施済み 2026-08-27 (real-corpus-replay-20260827.md)
  - id: MV-R2
    description: shadow 出力の record_digest を Python (json.dumps sort_keys+compact =
      JCS 近似の 別実装) で pipeline 外独立再計算し、宣言値と比較
    expected_status: 5/5 一致 (orchestrator 実施 2026-08-27)
goal_stopping_condition:
  - terra レビュー 7巡 (must 履歴 7→4→2→2→2→3→PASS、最終 369/369 passed・新規 must ゼロ)
  - 実 corpus replay で false allow ゼロ + 決定論 byte 一致 + 独立再計算一致
